# Raspberry Pi 4 / IMX219 camera stream for the PC-side Qt UI.
# Keep the local C++ publisher on TCP; allow Qt viewers to choose TCP or UDP.
rtspTransports: [udp, tcp]
rtmp: false
srt: false
moq: false

# WebRTC is suitable for a browser or Qt WebEngine view. HLS is a fallback.
webrtc: true
hls: true
hlsAddress: :8891  # Leave pigpio's default TCP port 8888 free.

# The watchdog reads viewer counts here. Keep diagnostics local to the Pi.
metrics: true
metricsAddress: 127.0.0.1:9998

paths:
  cam:
    source: publisher
    # 추적 중에만 내부 reader를 유지해 기존 on-demand 캡처를 재사용한다.
    runOnInit: /usr/local/libexec/ptz-camera/ptz_capture_lease
    runOnInitRestart: true
    # Start the camera only for a reader; stop it shortly after the last reader.
    runOnDemand: /usr/local/libexec/ptz-camera/ptz_camera_publisher
    runOnDemandRestart: true
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 5s

# BEGIN LOCAL_AUTH_DEFAULT
# Remote viewers require credentials generated outside the repository.
# Without account setup, only Pi-internal publisher/watchdog access is allowed.
authMethod: internal
rtspAuthMethods: [digest]
authInternalUsers:
  - user: any
    pass: ''
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: publish
        path: cam
      - action: read
        path: cam
      - action: metrics
# END LOCAL_AUTH_DEFAULT
